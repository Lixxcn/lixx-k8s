apiVersion: v1
kind: Service
metadata:
  name: nginx-tcp-udp-service
  namespace: default
spec:
  selector:
    app: nginx-proxy
  type: LoadBalancer  # 或者使用 NodePort
  ports:
    - name: tcp-6443
      protocol: TCP
      port: 6443
      targetPort: 6443
    - name: tcp-18443
      protocol: TCP
      port: 18443
      targetPort: 18443
    - name: tcp-38443
      protocol: TCP
      port: 38443
      targetPort: 38443
    - name: udp-4500
      protocol: UDP
      port: 4500
      targetPort: 4500
    - name: udp-123
      protocol: UDP
      port: 123
      targetPort: 123
