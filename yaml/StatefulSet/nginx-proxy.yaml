apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx-proxy
  namespace: default
spec:
  serviceName: nginx-proxy-headless
  replicas: 2  # 两个实例
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 6443
          protocol: TCP
        - containerPort: 18443
          protocol: TCP
        - containerPort: 38443
          protocol: TCP
        - containerPort: 4500
          protocol: UDP
        - containerPort: 123
          protocol: UDP
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config-volume
        configMap:
          name: nginx-config
